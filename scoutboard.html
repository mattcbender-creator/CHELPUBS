<meta charset="utf-8">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0C0D10; --panel:#141519; --panel2:#0F1013; --line:#26282F; --line2:#1C1E24;
  --ink:#EDEFF4; --mut:#9AA1AE; --faint:#62697A;
  --brand:#2B84FF; --gold:#FFC93C;
  --wm:#0069FA; --wm-t:#5CA3FF; --en:#C4841F; --en-t:#E8A94E;
  --good:#2A9D8F; --mid:#C4841F; --bad:#E5484D;
}
*{box-sizing:border-box;margin:0;min-width:0}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;padding-block:0 48px;padding-inline:20px;border-top:6px solid var(--brand)}
.board{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:"Barlow Condensed",Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;gap:14px;padding-block:20px 0}
.topbar img{height:40px;width:auto}
.topbar .prov{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:right}
header{padding-block:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(30px,5.5vw,54px);font-weight:700;line-height:1.02}
h1 .wm{color:var(--wm-t)} h1 .en{color:var(--en-t)}
h1 .vs{color:var(--faint);font-weight:500;font-size:.5em;vertical-align:middle;margin-inline:12px}
.verdict{display:flex;gap:14px;align-items:center;margin-top:14px}
.vbar{flex:1;height:14px;border-radius:4px;background:var(--line2);position:relative;overflow:hidden}
.vbar>i{position:absolute;top:0;bottom:0;transition:width .35s ease}
.vlab{font-size:12px;letter-spacing:.1em;color:var(--mut);white-space:nowrap}
.vcall{font-family:"Barlow Condensed";font-size:24px;font-weight:700;letter-spacing:.04em;color:var(--gold);margin-top:8px}
.vcall small{font-family:Archivo;font-size:11.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--faint);display:block}
.sect{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-family:"Barlow Condensed";
  margin-top:28px;padding-bottom:6px;border-bottom:1px solid var(--line);position:relative}
.sect::after{content:"";position:absolute;left:0;bottom:-1px;width:52px;height:2px;background:var(--brand)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.tpanel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tpanel h2{font-size:20px;letter-spacing:.05em;padding-bottom:8px}
.tpanel.w h2{color:var(--wm-t);border-bottom:2px solid var(--wm)}
.tpanel.e h2{color:var(--en-t);border-bottom:2px solid var(--en)}
.slotgrid{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;display:flex;align-items:center;gap:8px}
.slot .pos{font-size:10px;letter-spacing:.14em;color:var(--faint);min-width:26px}
.slot select{flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;
  font:600 14px/1.3 "Barlow Condensed",Arial,sans-serif;letter-spacing:.03em;padding:3px 5px;cursor:pointer}
.slot select:focus{outline:2px solid var(--brand);outline-offset:1px}
.gnum{font-family:"Barlow Condensed";font-size:19px;font-weight:700;min-width:30px;text-align:right}
.tw{font-size:9px;letter-spacing:.1em;font-weight:700;font-family:"Barlow Condensed";min-width:44px}
.unitrads{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.urad{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.urad h3{font-size:15px;letter-spacing:.08em;color:var(--mut)}
.urad h3 .w{color:var(--wm-t)} .urad h3 .e{color:var(--en-t)}
.urad .nets{font-size:11.5px;color:var(--faint)}
.legend{display:flex;gap:14px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pair{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;
  display:grid;grid-template-columns:1fr 168px;gap:6px 12px;align-items:center;transition:border-color .15s}
.pair:hover{border-color:#3A3D46}
.pair.hot{border-color:#6E5716}
.prow{display:grid;grid-template-columns:52px 1fr auto 1fr;gap:8px;align-items:center}
.prow .slotlab{font-size:10px;color:var(--faint);letter-spacing:.14em}
.pside{display:flex;align-items:center;gap:8px;min-width:0}
.pside.r{justify-content:flex-end;text-align:right}
.pside .nm{font-family:"Barlow Condensed";font-size:19px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pside.l .nm{color:var(--wm-t)} .pside.r .nm{color:var(--en-t)}
.badge{font-family:"Barlow Condensed";font-weight:700;font-size:16px;border-radius:4px;padding:1px 7px;color:#fff;min-width:34px;text-align:center}
.gapchip{font-family:"Barlow Condensed";font-size:12px;font-weight:700;color:var(--gold);border:1px solid #6E5716;border-radius:4px;padding:1px 6px}
.axchip{font-size:10px;letter-spacing:.08em;border-radius:3px;padding:1px 6px;font-weight:600;font-family:"Barlow Condensed";letter-spacing:.1em}
.pmeta{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.pmeta .cap{font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.goalies{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 15px;display:flex;gap:16px;align-items:center}
.gcard .sv{font-family:"Barlow Condensed";font-size:44px;font-weight:700;line-height:1}
.gcard.w .sv{color:var(--wm-t)} .gcard.e .sv{color:var(--en-t)}
.gcard .gd{flex:1}
.gcard .gd .who{font-family:"Barlow Condensed";font-size:19px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.gcard .gd p{font-size:11.5px;color:var(--faint);margin-top:2px}
.chip{font-size:9.5px;letter-spacing:.08em;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.LOW{color:var(--bad);border-color:#5A2A2C}.chip.MODERATE{color:var(--mid);border-color:#6E5716}
.chip.SOLID{color:var(--mut)}.chip.HIGH{color:var(--good);border-color:#1E5B53}
.edges{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.erow{display:grid;grid-template-columns:110px 1fr 40px 1fr;gap:8px;align-items:center;margin-top:8px}
.erow .el{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:right}
.eb{height:10px;border-radius:3px;background:var(--line2);position:relative;overflow:hidden}
.eb>i{position:absolute;top:0;bottom:0;border-radius:3px}
.eb.l>i{right:0;background:var(--wm)} .eb.r>i{left:0;background:var(--en)}
.emid{font-size:12px;color:var(--mut);text-align:center}
.dossiers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-top:8px}
.dh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;cursor:pointer;list-style:none}
summary.dh::-webkit-details-marker{display:none}
.dh .nm{font-family:"Barlow Condensed";font-size:19px;font-weight:600}
.dcol.w .dh .nm{color:var(--wm-t)} .dcol.e .dh .nm{color:var(--en-t)}
.arch{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid #6E5716;border-radius:3px;padding:1px 7px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-top:9px}
.tiles>div{background:var(--panel2);padding:6px 4px;text-align:center}
.tiles .cv{font-family:"Barlow Condensed";font-size:21px;font-weight:700;line-height:1.05}
.tiles .cl{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:1px}
.spec{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:9px}
.spec .sl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.spec .tr{height:5px;border-radius:3px;background:var(--line2);position:relative}
.spec .tr>i{position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:var(--brand);border:2px solid #fff2}
.axrow{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.fline{font-size:10.5px;color:var(--faint);margin-top:7px}
.method{display:block;margin-top:26px;font-size:11.5px;color:var(--faint);line-height:1.65}
.method b{color:var(--mut)}
.brandfoot{margin-top:14px;font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brandfoot b{color:var(--brand)}
.brandfoot .r{letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}
svg text{font-family:"Barlow Condensed",Arial,sans-serif}
@media(max-width:560px){
  body{font-size:11.5px;padding-inline:8px;padding-block:0 20px;border-top-width:4px}
  .topbar{padding-block:10px 0;gap:8px}.topbar img{height:28px}.topbar .prov{display:none}
  header{padding-block:8px 10px}h1{font-size:20px}.vcall{font-size:15px;margin-top:3px}
  .verdict{margin-top:8px;gap:8px}.vbar{height:9px}.vlab{font-size:9px}
  .sect{margin-top:14px;font-size:10px}
  .teams,.unitrads,.goalies,.dossiers{gap:8px}
  .tpanel{padding:7px 8px}.tpanel h2{font-size:14px}
  .slotgrid{gap:3px;margin-top:6px}.slot{padding:3px 5px;gap:4px}.slot .pos{min-width:20px;font-size:8.5px}
  .slot select{font-size:11.5px;padding:2px 3px}.gnum{font-size:14px;min-width:24px}.tw{font-size:7.5px;min-width:34px}
  .urad{padding:7px}.urad h3{font-size:12px}.urad .nets{font-size:9.5px}.urad svg{width:150px;height:150px}
  .pair{grid-template-columns:1fr 104px;padding:6px 8px;margin-top:4px;gap:3px 6px}
  .pair svg{width:104px;height:104px}
  .prow{grid-template-columns:40px 1fr auto 1fr;gap:4px}
  .prow .slotlab{font-size:8px}.pside .nm{font-size:12.5px}.badge{font-size:12px;padding:0 4px;min-width:26px}
  .gapchip{font-size:9.5px}.axchip{font-size:8px}.pmeta{margin-top:3px;gap:4px}.pmeta .cap{font-size:8px}
  .gcard{padding:6px 8px;gap:8px}.gcard .sv{font-size:24px}.gcard .gd .who{font-size:13px}.gcard .gd p{font-size:9.5px}
  .edges{padding:8px 10px}.erow{grid-template-columns:66px 1fr 28px 1fr;gap:4px;margin-top:5px}.erow .el{font-size:8px}
  .dcard{padding:7px 9px;margin-top:5px}.dh .nm{font-size:13px}.arch{font-size:8px;padding:0 4px}
  .tiles .cv{font-size:15px}.tiles .cl{font-size:7px}.tiles>div{padding:4px 2px}
  .spec{margin-top:6px;gap:6px}.spec .sl{font-size:8px}
  .fline{font-size:9px}.method{font-size:8.5px;line-height:1.45;margin-top:10px}.brandfoot{font-size:9px}
}
</style>

const overall=n=>{const p=P(n);if(!p)return null;const v=Object.entries(p.axes||{}).filter(([k])=>k!=="physicality").map(([,x])=>x);return v.length?Math.round(mean(v)):null};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const tier=p=>p>=90?"ELITE":p>=78?"STUD":p>=62?"SOLID":p>=45?"MID":p>=30?"WEAK":p>=15?"BAD":"SHITTER";
const tcol=p=>p>=62?"var(--good)":p>=45?"var(--mid)":"var(--bad)";
function formOf(p){const f=(p.form_priv&&p.form_priv.gp>=3)?p.form_priv:((p.form_all&&p.form_all.gp>=3)?p.form_all:null);
  return f?{...f,src:(f===p.form_priv?"scrims":"recent")}:null}

function radarSVG(axA,axB,size,defs){
  defs=defs||AXES;
  const cx=size/2, cy=size/2+3, R=size/2-27;
  const pt=(i,r)=>{const a=(-90+i*72)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const ring=f=>"M"+[0,1,2,3,4].map(i=>pt(i,R*f).map(v=>v.toFixed(1)).join(",")).join("L")+"Z";
  const poly=ax=>{if(!ax)return "";const ps=[0,1,2,3,4].map(i=>{const v=ax[defs[i][1]];return pt(i,R*(v!=null?Math.max(v,3)/100:0))});
    return "M"+ps.map(p=>p.map(v=>v.toFixed(1)).join(",")).join("L")+"Z"};
  let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img">`;
  s+=`<path d="${ring(1)}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  s+=`<path d="${ring(.5)}" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>`;
  for(let i=0;i<5;i++){const[x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line2)" stroke-width="1"/>`}
  if(axB)s+=`<path d="${poly(axB)}" fill="rgba(196,132,31,.30)" stroke="#E8A94E" stroke-width="1.6"/>`;
  if(axA)s+=`<path d="${poly(axA)}" fill="rgba(0,105,250,.26)" stroke="#5CA3FF" stroke-width="1.6"/>`;
  for(let i=0;i<5;i++){const[x,y]=pt(i,R+14);
    const a=axA?axA[defs[i][1]]:null, b=axB?axB[defs[i][1]]:null;
    s+=`<text x="${x.toFixed(1)}" y="${(y-1).toFixed(1)}" text-anchor="middle" font-size="10" letter-spacing=".08em" fill="var(--faint)">${defs[i][0]}</text>`;
    if(a!=null||b!=null){
      const va=a!=null?Math.round(a):"·", vb=b!=null?Math.round(b):"·";
      s+=`<text x="${x.toFixed(1)}" y="${(y+10).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600">`+
         `<tspan fill="#5CA3FF">${va}</tspan><tspan fill="var(--faint)"> · </tspan><tspan fill="#E8A94E">${vb}</tspan></text>`;
    }
  }
  return s+"</svg>";
}
const unitAxes=(cid,slots)=>{const o={};for(const[,k]of AXES){const v=slots.map(s=>{const p=P(lineup[cid][s]);return p&&p.axes?p.axes[k]:null}).filter(x=>x!=null);o[k]=v.length?mean(v):null}return o};

function archetype(p){
  if(!p)return null;
  if(p.primary==="G"||(p.gl&&p.gl.gp>p.gp/2))return {tag:"GOALTENDER"};
  const ax=p.axes||{}, gs=p.g+p.a?100*p.g/(p.g+p.a):0;
  const isD=["D","LD","RD"].includes(p.primary);
  if(isD){
    if((ax.scoring||0)>=60)return{tag:"OFFENSIVE D"};
    if((ax.impact||0)>=90&&(ax.physicality||0)>=50)return{tag:"SHUTDOWN D"};
    if((ax.impact||0)>=90)return{tag:"POSITIONAL D"};
    return{tag:"TWO-WAY D"};
  }
  if((ax.scoring||0)>=75&&(ax.playmaking||0)>=75)return{tag:"DUAL THREAT"};
  if(gs>=55&&(ax.scoring||0)>=55)return{tag:"SNIPER"};
  if(gs<=45&&(ax.playmaking||0)>=60)return{tag:"PLAYMAKER"};
  if((ax.physicality||0)>=70)return{tag:"POWER FORWARD"};
  if((ax.impact||0)>=90)return{tag:"TWO-WAY F"};
  return{tag:"DEPTH F"};
}
function slotHTML(cid,sl){
  const cur=lineup[cid][sl]||"";
  const mine=D.clubs[cid].pool, other=Object.keys(D.players).filter(n=>!mine.includes(n)).sort();
  const opt=n=>{const p=P(n);const o=overall(n);return `<option value="${esc(n)}" ${n===cur?"selected":""}>${esc(n)}${o!=null?" · "+o:""}${p&&p.primary?" · "+p.primary:""}</option>`};
  const p=P(cur);
  const gl=p&&p.gl&&sl==="G";
  const grade=gl?(p.gl.pct!=null?p.gl.pct:null):(cur?overall(cur):null);
  return `<div class="slot"><span class="pos">${sl}</span>
    <select data-cid="${cid}" data-slot="${sl}"><option value="">—</option>
      <optgroup label="dressed for this club">${mine.map(opt).join("")}</optgroup>
      <optgroup label="everyone harvested">${other.map(opt).join("")}</optgroup></select>
    ${grade!=null?`<span class="gnum num" style="color:${tcol(grade)}">${grade}</span><span class="tw" style="color:${tcol(grade)}">${tier(grade)}</span>`:""}
  </div>`;
}
function unitRadHTML(){
  const POSDEFS=[["LW","LW"],["C","C"],["RW","RW"],["LD","LD"],["RD","RD"]];
  const posAxes=cid=>{const o={};for(const sl of SLOTS.slice(0,5))o[sl]=overall(lineup[cid][sl]);return o};
  const g=cid=>{const n=lineup[cid]["G"];const p=P(n);return p&&p.gl&&p.gl.svpct?`${esc(n)} ${p.gl.svpct.toFixed(3)}`:(n?esc(n):"—")};
  const leg=`<div class="legend"><span><i style="background:#5CA3FF"></i>Wildman</span><span><i style="background:#E8A94E"></i>Entourage</span><span style="opacity:.7">· · 50th = typical</span></div>`;
  return `
  <div class="urad">${radarSVG(posAxes(WM),posAxes(EN),240,POSDEFS)}
    <h3>By position</h3><span class="nets num">Nets: ${g(WM)} · ${g(EN)}</span>${leg}</div>
  <div class="urad">${radarSVG(unitAxes(WM,SLOTS.slice(0,5)),unitAxes(EN,SLOTS.slice(0,5)),240)}
    <h3>By play style</h3><span class="nets">Five-man mean percentile per axis</span>${leg}</div>`;
}
function pairHTML(){
  let h="";
  for(const[ws,es] of PAIRS){
    const wn=lineup[WM][ws],en=lineup[EN][es];
    const wp=P(wn), ep=P(en);
    const wo=overall(wn), eo=overall(en);
    const gap=(wo!=null&&eo!=null)?wo-eo:null;
    const hot=gap!=null&&Math.abs(gap)>=15;
    let chips="";
    if(ep&&ep.axes&&Object.keys(ep.axes).length){
      const weak=Object.entries(ep.axes).filter(([k])=>k!=="physicality").sort((a,b)=>a[1]-b[1])[0];
      chips+=`<span class="cap">${esc(en)} low:</span><span class="axchip" style="color:${tcol(weak[1])};border:1px solid ${tcol(weak[1])}44">${AXNAME[weak[0]]} ${weak[1]}</span>`;
    }
    if(wp&&wp.axes&&Object.keys(wp.axes).length){
      const weak=Object.entries(wp.axes).filter(([k])=>k!=="physicality").sort((a,b)=>a[1]-b[1])[0];
      chips+=`<span class="cap">${esc(wn)} low:</span><span class="axchip" style="color:${tcol(weak[1])};border:1px solid ${tcol(weak[1])}44">${AXNAME[weak[0]]} ${weak[1]}</span>`;
    }
    h+=`<div class="pair${hot?" hot":""}"><div>
      <div class="prow"><span class="slotlab">${ws} v ${es}</span>
        <span class="pside l">${wo!=null?`<span class="badge num" style="background:${tcol(wo)}">${wo}</span>`:""}<span class="nm">${wn?esc(wn):"—"}</span></span>
        <span style="display:flex;gap:6px;align-items:center">${hot?`<span class="gapchip num">Δ${Math.abs(gap)}</span>`:`<span class="slotlab">vs</span>`}</span>
        <span class="pside r"><span class="nm">${en?esc(en):"—"}</span>${eo!=null?`<span class="badge num" style="background:${tcol(eo)}">${eo}</span>`:""}</span></div>
      <div class="pmeta">${chips}</div></div>
      ${radarSVG(wp&&wp.axes,ep&&ep.axes,168)}</div>`;
  }
  return h;
}
function goalieHTML(){
  const g=(cid,cls,label)=>{const n=lineup[cid]["G"];if(!n)return "";
    const p=P(n);const priv=p.form_priv&&p.form_priv.gl_gp?p.form_priv:null;
    const career=p.gl&&p.gl.svpct?p.gl:null;
    const sv=priv?priv.gl_svpct:(career?career.svpct:null);
    const src=priv?`${priv.gl_gp} scrims · ${priv.gl_sv} saves / ${priv.gl_sh} shots · ${priv.gl_ga} GA`:(career?`season · ${career.gp} games in net`:"no net sample");
    const pct=p.gl&&p.gl.pct!=null?p.gl.pct:null;
    return `<div class="gcard ${cls}"><span class="sv num">${sv!=null?sv.toFixed(3):"—"}</span>
      <div class="gd"><span class="who">${esc(n)}${pct!=null?`<span class="tw" style="color:${tcol(pct)};font-size:12px">${tier(pct)} ${pct}th</span>`:""}<span class="chip ${p.conf}">${p.conf}</span></span>
      <p>${label} · ${src}${p.gp<5?` · ${p.gp} gp season record`:""}</p></div></div>`};
  return g(WM,"w","Wildman net")+g(EN,"e","Entourage net");
}
function edgeCalc(){
  const dims=[["Top-end",c=>{const v=SLOTS.slice(0,5).map(s=>overall(lineup[c][s])).filter(x=>x!=null);return v.length?Math.max(...v):null}],
    ["Depth",c=>{const v=SLOTS.slice(0,5).map(s=>overall(lineup[c][s])).filter(x=>x!=null).sort((a,b)=>a-b);return v.length>=3?Math.round(mean(v.slice(0,3))):null}],
    ["Playmaking",c=>{const v=SLOTS.slice(0,5).map(s=>{const p=P(lineup[c][s]);return p&&p.axes?p.axes.playmaking:null}).filter(x=>x!=null);return v.length?Math.round(mean(v)):null}],
    ["Physical",c=>{const v=SLOTS.slice(0,5).map(s=>{const p=P(lineup[c][s]);return p&&p.axes?p.axes.physicality:null}).filter(x=>x!=null);return v.length?Math.round(mean(v)):null}],
    ["Goaltending",c=>{const n=lineup[c]["G"];const p=P(n);return p&&p.gl&&p.gl.pct!=null?p.gl.pct:null}]];
  return dims.map(([lab,f])=>[lab,f(WM),f(EN)]);
}
function edgeIndex(){
  const ds=[];
  for(const[ws,es] of PAIRS){const a=overall(lineup[WM][ws]),b=overall(lineup[EN][es]);if(a!=null&&b!=null)ds.push(a-b)}
  const gw=edgeCalc()[4];if(gw[1]!=null&&gw[2]!=null)ds.push(gw[1]-gw[2]);
  return ds.length?mean(ds):0;
}
function dossierHTML(cid,cls){
  return SLOTS.map(sl=>{
    const n=lineup[cid][sl];const p=P(n);if(!p)return "";
    const a=archetype(p), f=formOf(p), gl=sl==="G";
    const cell=(v,l,c)=>`<div><div class="cv num" ${c?`style="color:${c}"`:""}>${v}</div><div class="cl">${l}</div></div>`;
    const tiles=gl
      ? cell(p.gl&&p.gl.svpct?p.gl.svpct.toFixed(3):"—","SV%")+cell(p.gl&&p.gl.gaa?p.gl.gaa.toFixed(2):"—","GAA")+cell(p.gl?p.gl.gp:0,"GP NET")+cell(p.gp,"GP")
      : cell(p.g+p.a,"PTS")+cell(p.g,"G")+cell(p.a,"A")+cell(p.ppg.toFixed(2),"P/GP")+cell((p.pm>0?"+":"")+p.pm,"+/-")+cell(p.gp,"GP");
    const gs=(p.g+p.a)?100*p.g/(p.g+p.a):null;
    const spec=(!gl&&gs!=null)?`<div class="spec"><span class="sl">Shooter</span><div class="tr"><i style="left:${(100-gs).toFixed(0)}%"></i></div><span class="sl">Playmaker</span></div>`:"";
    const axch=(!gl&&p.axes)?`<div class="axrow">${AXES.map(([lab,k])=>{const v=p.axes[k];return v!=null?`<span class="axchip num" style="color:${tcol(v)};border:1px solid ${tcol(v)}44">${lab} ${v}</span>`:""}).join("")}</div>`:"";
    const fl=f&&!gl?`${f.gp} ${f.src}: ${f.gpg}G ${f.apg}A /gm${f.passpct?` · ${f.passpct}% pass`:""}${f.poss?` · ${f.poss}s poss/gm`:""}${(f.fow+f.fol)>=20?` · ${Math.round(100*f.fow/(f.fow+f.fol))}% dot (${f.fow+f.fol})`:""}`:
             (f&&gl&&f.gl_gp?`${f.gl_gp} ${f.src}: ${f.gl_svpct.toFixed(3)} on ${f.gl_sh} shots`:"");
    return `<details class="dcard" ${window.innerWidth>700?"open":""}>
      <summary class="dh"><span class="nm">${esc(n)}</span><span class="arch">${a.tag}</span><span class="chip ${p.conf}">${p.conf}</span><span class="chip">${sl}</span></summary>
      <div class="tiles">${tiles}</div>${spec}${axch}
      ${fl?`<div class="fline num">${fl}</div>`:""}</details>`;
  }).join("");
}
function render(){
  document.getElementById("wslots").innerHTML=SLOTS.map(s=>slotHTML(WM,s)).join("");
  document.getElementById("eslots").innerHTML=SLOTS.map(s=>slotHTML(EN,s)).join("");
  document.getElementById("unitrads").innerHTML=unitRadHTML();
  document.getElementById("plist").innerHTML=pairHTML();
  document.getElementById("goalies").innerHTML=goalieHTML();
  document.getElementById("wdoss").innerHTML=dossierHTML(WM,"w");
  document.getElementById("edoss").innerHTML=dossierHTML(EN,"e");
  const ei=edgeIndex();
  const vb=document.getElementById("vbar");
  const mag=Math.min(Math.abs(ei),30)/30*50;
  vb.innerHTML=ei>=0?`<i style="right:50%;width:${mag}%;background:var(--wm)"></i><i style="left:50%;width:2px;background:var(--faint)"></i>`
                    :`<i style="left:50%;width:${mag}%;background:var(--en)"></i><i style="right:50%;width:2px;background:var(--faint)"></i>`;
  const lean=Math.abs(ei)<3?"COIN FLIP":`${ei>0?"WILDMAN":"ENTOURAGE"} +${Math.abs(ei).toFixed(0)}`;
  let sub="";
  if(baseline===null)baseline=ei;
  else{const mv=ei-baseline;if(Math.abs(mv)>=1)sub=`<small>swap moved the edge ${mv>0?"+":""}${mv.toFixed(0)} toward ${mv>0?"Wildman":"Entourage"} vs default lineups</small>`}
  document.getElementById("vcall").innerHTML=lean+sub;
  document.getElementById("eboard").innerHTML=edgeCalc().map(([lab,a,b])=>`<div class="erow"><span class="el">${lab}</span>
    <div class="eb l"><i style="width:${a||0}%"></i></div><span class="emid num">${a!=null?a:"·"}–${b!=null?b:"·"}</span>
    <div class="eb r"><i style="width:${b||0}%"></i></div></div>`).join("");
  const gs=c=>D.clubs[c].games_seen;
  document.getElementById("prov").textContent=`Pubs Scouting Report · ${gs(WM)+gs(EN)} matches · ${D.generated}`;
  document.getElementById("method").innerHTML=`<b>How to read this.</b> Every number is computed from EA's public Pro Clubs API — season aggregates plus a harvest of both clubs' recent private and public match feeds. Percentiles rank each player against the ChelScout population pool at his position: ELITE 90+ · STUD 78+ · SOLID 62+ · MID 45+ · WEAK 30+ · BAD 15+. The dashed ring on every radar is the 50th percentile — a typical player. Δ marks a position gap of 15+ points. Confidence: LOW &lt;5 gp · MODERATE 5–10 · SOLID 10–15 · HIGH 15+. NHL 27 wiped season stats at rollover — scrim samples carry recent form. Swap any name and the board re-runs.`;
  document.querySelectorAll("select[data-cid]").forEach(s=>s.onchange=e=>{
    lineup[e.target.dataset.cid][e.target.dataset.slot]=e.target.value||null;render()});
}
render();
</script>
