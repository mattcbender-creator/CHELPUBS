# Weekly percentile-pool rebuild. Rescrapes EA, picks a game floor per
# position (ramping up from 15 to 50 over the first weeks of a season),
# keeps last season's bands for any position that is still too thin, and
# commits pool.json if it changed. The push to main is what deploys it:
# Railway builds every commit on main, so the bot picks the new pool up
# within a couple of minutes, with nobody touching anything.
#
# Runs on GitHub's machines on purpose. The scrape got a whole machine
# banned by EA once; if that happened on the Railway box, /pubscout would
# die for everyone. build_pool.py aborts without writing if the sample is
# too small to be a population, which is what a block looks like.
name: Rebuild percentile pool

on:
  schedule:
    - cron: "0 9 * * 0"   # Sundays 09:00 UTC (05:00 Eastern)
  workflow_dispatch:       # "Run workflow" button
    inputs:
      commit:
        description: "Commit pool.json if it changed (untick to test the scrape only)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rebuild-pool
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POOL_SEASON: "NHL 27"
      POOL_PREV_SEASON: "NHL 26"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the scraper's one dependency
        run: pip install "curl_cffi>=0.7.0"

      - name: Sample EA and rebuild pool.json
        run: python build_pool.py --refresh

      - name: Show what the pool would become
        run: |
          git --no-pager diff --stat -- pool.json || true
          python -c "import json,build_pool; p=json.load(open('pool.json')); print('season', p['meta']['season'], 'built', p['meta']['built']); print(build_pool.summary(p))"

      - name: Commit if the pool changed
        if: github.event_name == 'schedule' || inputs.commit
        run: |
          if git diff --quiet -- pool.json; then
            echo "pool.json unchanged -- nothing to commit"
            exit 0
          fi
          summary=$(python -c "import json,build_pool; print(build_pool.summary(json.load(open('pool.json'))))")
          git config user.name  "pool-rebuild"
          git config user.email "pool-rebuild@users.noreply.github.com"
          git add pool.json
          git commit -m "Weekly pool rebuild: ${summary}" \
                     -m "Automated by .github/workflows/rebuild-pool.yml. Positions listed with a game floor are ranked on this season's sample; positions listed with a season name are still on that season's bands until they have 150 players."
          git push
